<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Screen 07 — Login & Register | QuickBite</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root { --red:#FF4B2B; --red2:#FF416C; --bg:#FAFAF8; --text:#1A1A2E; --muted:#6B7280; --border:#E5E7EB; --grad:linear-gradient(135deg,#FF4B2B,#FF416C); }
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#1A1A2E,#16213E);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;}
h1{font-family:'Poppins',sans-serif;}
.logo{font-family:'Poppins',sans-serif;font-weight:800;font-size:24px;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center;margin-bottom:6px;}
.tag{display:inline-flex;align-items:center;gap:6px;background:rgba(255,75,43,0.15);border:1px solid rgba(255,75,43,0.3);color:#FF6B4B;border-radius:999px;padding:4px 14px;font-size:12px;font-weight:600;font-family:'Poppins',sans-serif;margin-bottom:20px;}
/* Tabs */
.tabs{display:flex;background:rgba(255,255,255,0.08);border-radius:14px;padding:4px;margin-bottom:28px;gap:4px;}
.tab{flex:1;padding:10px;border-radius:10px;font-size:14px;font-weight:600;font-family:'Poppins',sans-serif;cursor:pointer;border:none;background:transparent;color:rgba(255,255,255,0.5);transition:all 0.2s;}
.tab.active{background:#fff;color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,0.15);}
/* Card */
.card{background:#fff;border-radius:24px;padding:40px;width:100%;max-width:460px;box-shadow:0 32px 80px rgba(0,0,0,0.35);}
/* Panel */
.panel{display:none;}
.panel.active{display:block;}
/* Form */
.form-group{margin-bottom:16px;}
.form-label{display:block;font-size:13px;font-weight:600;color:var(--text);margin-bottom:6px;font-family:'Poppins',sans-serif;}
.form-input{width:100%;padding:12px 16px;border:2px solid var(--border);border-radius:10px;font-size:15px;outline:none;transition:border 0.2s;font-family:'Inter',sans-serif;}
.form-input:focus{border-color:var(--red);}
.form-input::placeholder{color:#9CA3AF;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
/* Buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer;border:none;font-family:'Poppins',sans-serif;transition:all 0.2s;margin-bottom:10px;}
.btn-primary{background:var(--grad);color:#fff;}
.btn-primary:hover{opacity:0.9;transform:translateY(-1px);box-shadow:0 6px 20px rgba(255,75,43,0.35);}
.btn-google{background:#fff;color:var(--text);border:2px solid var(--border);}
.btn-google:hover{border-color:var(--red);}
/* Divider */
.divider{display:flex;align-items:center;gap:14px;margin:16px 0;color:var(--muted);font-size:13px;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border);}
/* Forgot */
.forgot{text-align:right;margin-bottom:20px;}
.forgot a{font-size:13px;color:var(--red);font-weight:600;cursor:pointer;text-decoration:none;}
/* Switch */
.switch{text-align:center;font-size:14px;color:var(--muted);margin-top:20px;}
.switch span{color:var(--red);font-weight:600;cursor:pointer;}
/* Terms */
.terms{display:flex;align-items:flex-start;gap:10px;margin-bottom:20px;}
.terms input{margin-top:3px;accent-color:var(--red);}
.terms label{font-size:13px;color:var(--muted);line-height:1.5;}
.terms label a{color:var(--red);cursor:pointer;}
/* Strength bar */
.strength-bar{height:4px;border-radius:999px;background:#E5E7EB;margin-top:6px;overflow:hidden;}
.strength-fill{height:100%;border-radius:999px;width:0%;transition:width 0.3s,background 0.3s;}
.strength-text{font-size:11px;color:var(--muted);margin-top:4px;}
/* Password wrapper */
.pw-wrap{position:relative;}
.pw-toggle{position:absolute;right:14px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:16px;color:var(--muted);}
/* Social row */
.social-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.btn-social{display:flex;align-items:center;justify-content:center;gap:8px;padding:11px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;border:2px solid var(--border);background:#fff;font-family:'Poppins',sans-serif;transition:all 0.2s;}
.btn-social:hover{border-color:var(--red);}
/* Back link */
.back{display:flex;align-items:center;gap:8px;color:rgba(255,255,255,0.5);font-size:14px;cursor:pointer;margin-bottom:24px;font-family:'Poppins',sans-serif;font-weight:600;transition:color 0.2s;}
.back:hover{color:rgba(255,255,255,0.9);}
/* Notification */
.notif{background:#D1FAE5;border-radius:10px;padding:12px 16px;font-size:13px;color:#065F46;font-weight:600;margin-bottom:16px;display:none;align-items:center;gap:8px;}
.notif.show{display:flex;}
/* Error */
.err-msg{font-size:12px;color:var(--red);margin-top:4px;display:none;}
.form-input.error{border-color:var(--red);}
</style>
</head>
<body>

<div class="back" onclick="window.location.href='../prototype/prototype.html'">← Back to Prototype</div>
<div class="tag">🔐 Authentication Screen</div>
<div class="logo">🍔 QuickBite</div>

<div class="card">
  <div class="notif" id="success-notif">✅ Account created! Welcome to QuickBite.</div>

  <!-- TABS -->
  <div class="tabs">
    <button class="tab active" id="tab-login" onclick="switchTab('login')">Sign In</button>
    <button class="tab"        id="tab-register" onclick="switchTab('register')">Create Account</button>
  </div>

  <!-- ── LOGIN PANEL ── -->
  <div class="panel active" id="panel-login">
    <div class="form-group">
      <label class="form-label">Email Address</label>
      <input class="form-input" id="login-email" type="email" placeholder="you@example.com" oninput="clearErr('login-email','email-err')">
      <div class="err-msg" id="email-err">Please enter a valid email address.</div>
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <div class="pw-wrap">
        <input class="form-input" id="login-pw" type="password" placeholder="Enter your password" oninput="clearErr('login-pw','pw-err')">
        <span class="pw-toggle" onclick="togglePw('login-pw',this)">👁️</span>
      </div>
      <div class="err-msg" id="pw-err">Password is required.</div>
    </div>
    <div class="forgot"><a>Forgot your password?</a></div>
    <button class="btn btn-primary" onclick="doLogin()">Sign In →</button>
    <div class="divider">or continue with</div>
    <div class="social-row">
      <button class="btn-social">🌐 Google</button>
      <button class="btn-social">📱 MoMo</button>
    </div>
    <div class="switch">Don't have an account? <span onclick="switchTab('register')">Sign Up free</span></div>
  </div>

  <!-- ── REGISTER PANEL ── -->
  <div class="panel" id="panel-register">
    <div class="grid-2">
      <div class="form-group"><label class="form-label">First Name</label><input class="form-input" placeholder="Amina"></div>
      <div class="form-group"><label class="form-label">Last Name</label><input class="form-input" placeholder="Uwase"></div>
    </div>
    <div class="form-group">
      <label class="form-label">Email Address</label>
      <input class="form-input" type="email" placeholder="you@example.com">
    </div>
    <div class="form-group">
      <label class="form-label">Phone Number</label>
      <input class="form-input" placeholder="+250 7XX XXX XXX">
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <div class="pw-wrap">
        <input class="form-input" id="reg-pw" type="password" placeholder="Min. 8 characters" oninput="checkStrength(this.value)">
        <span class="pw-toggle" onclick="togglePw('reg-pw',this)">👁️</span>
      </div>
      <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
      <div class="strength-text" id="strength-text"></div>
    </div>
    <div class="form-group">
      <label class="form-label">Confirm Password</label>
      <div class="pw-wrap">
        <input class="form-input" type="password" placeholder="Repeat password">
        <span class="pw-toggle" onclick="togglePw('reg-cpw',this)">👁️</span>
      </div>
    </div>
    <div class="terms">
      <input type="checkbox" id="terms-chk">
      <label for="terms-chk">I agree to the <a>Terms of Service</a> and <a>Privacy Policy</a> of QuickBite Rwanda.</label>
    </div>
    <button class="btn btn-primary" onclick="doRegister()">Create Account →</button>
    <div class="switch">Already have an account? <span onclick="switchTab('login')">Sign In</span></div>
  </div>
</div>

<script>
function switchTab(tab) {
  document.getElementById('panel-login').classList.toggle('active', tab==='login');
  document.getElementById('panel-register').classList.toggle('active', tab==='register');
  document.getElementById('tab-login').classList.toggle('active', tab==='login');
  document.getElementById('tab-register').classList.toggle('active', tab==='register');
}

function togglePw(id, btn) {
  const inp = document.getElementById(id);
  if (!inp) return;
  inp.type = inp.type === 'password' ? 'text' : 'password';
  btn.textContent = inp.type === 'password' ? '👁️' : '🙈';
}

function clearErr(inputId, errId) {
  document.getElementById(inputId).classList.remove('error');
  document.getElementById(errId).style.display = 'none';
}

function showErr(inputId, errId) {
  document.getElementById(inputId).classList.add('error');
  document.getElementById(errId).style.display = 'block';
}

function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pw    = document.getElementById('login-pw').value;
  let ok = true;
  if (!email || !email.includes('@')) { showErr('login-email','email-err'); ok=false; }
  if (!pw) { showErr('login-pw','pw-err'); ok=false; }
  if (ok) window.location.href = '../prototype/prototype.html';
}

function doRegister() {
  const chk = document.getElementById('terms-chk').checked;
  if (!chk) { alert('Please accept the Terms of Service to continue.'); return; }
  const notif = document.getElementById('success-notif');
  notif.classList.add('show');
  switchTab('login');
  setTimeout(() => notif.classList.remove('show'), 4000);
}

function checkStrength(pw) {
  const fill = document.getElementById('strength-fill');
  const text = document.getElementById('strength-text');
  let score = 0;
  if (pw.length >= 8)  score++;
  if (/[A-Z]/.test(pw)) score++;
  if (/[0-9]/.test(pw)) score++;
  if (/[^A-Za-z0-9]/.test(pw)) score++;
  const levels = [
    { w:'0%',   bg:'#E5E7EB', label:'' },
    { w:'25%',  bg:'#EF4444', label:'Weak' },
    { w:'50%',  bg:'#F59E0B', label:'Fair' },
    { w:'75%',  bg:'#3B82F6', label:'Good' },
    { w:'100%', bg:'#22C55E', label:'Strong 💪' },
  ];
  const lvl = levels[score];
  fill.style.width = lvl.w;
  fill.style.background = lvl.bg;
  text.textContent = lvl.label;
  text.style.color = lvl.bg;
}
</script>
<a href="../index.html" style="
  position:fixed;bottom:24px;left:24px;z-index:99999;
  display:flex;align-items:center;gap:8px;
  background:#1A1A2E;color:#fff;padding:10px 16px;
  border-radius:12px;font-family:'Poppins',sans-serif;font-size:13px;font-weight:700;
  text-decoration:none;box-shadow:0 4px 20px rgba(0,0,0,0.35);
  border:1px solid rgba(255,255,255,0.12);
">← Back to Hub</a></body>
</html>
